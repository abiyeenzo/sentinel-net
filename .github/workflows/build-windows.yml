name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests
        run: node --test

      - name: Build exe (pkg)
        run: |
          npm install -g @yao-pkg/pkg
          mkdir dist
          pkg src/cli.js --targets node20-win-x64 --output dist/sentinel-net.exe

      - name: Smoke test (exe sans cible doit refuser de scanner)
        shell: pwsh
        run: |
          ./dist/sentinel-net.exe
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Checksums SHA-256
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Get-FileHash dist/sentinel-net.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  sentinel-net.exe" } |
            Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-net-windows
          path: dist/

      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sentinel-net.exe
            dist/SHA256SUMS.txt
